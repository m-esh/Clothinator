<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Clad mark: a bold C that turns into a hanger. Drawn as a polished
       metal glyph on a black glass tile, to sit with iOS 26 dark/tinted
       home screens. Full-bleed and opaque: iOS applies its own corner mask. -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="22%" r="85%">
      <stop offset="0" stop-color="#34373e"/>
      <stop offset="0.55" stop-color="#16181c"/>
      <stop offset="1" stop-color="#060708"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <!-- brushed chrome: bright top, dark band, soft bounce light at the bottom -->
    <linearGradient id="chrome" x1="0" y1="150" x2="0" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="0.3" stop-color="#d9dce1"/>
      <stop offset="0.52" stop-color="#8b9099"/>
      <stop offset="0.66" stop-color="#c3c7ce"/>
      <stop offset="0.86" stop-color="#e6e8ec"/>
      <stop offset="1" stop-color="#9ea3ac"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <ellipse cx="512" cy="40" rx="620" ry="420" fill="url(#sheen)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="222" fill="none" stroke="url(#rim)" stroke-width="7"/>

  <!-- mark: a bold C that becomes the hanger's hook -->
  <g transform="translate(0 40)">
  <g filter="url(#lift)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- dark edge so the metal separates from the tile -->
    <g stroke="#000" stroke-opacity="0.55">
      <path stroke-width="124" d="M627 234 A 150 150 0 1 0 627 426"/>
      <path stroke-width="86" d="M512 470 L 512 506"/>
      <path stroke-width="86" d="M512 506 L 238 686 Q 204 710 238 732 L 786 732 Q 820 710 786 686 Z"/>
    </g>
    <g stroke="url(#chrome)">
      <path stroke-width="70" d="M512 470 L 512 506"/>
      <path stroke-width="108" d="M627 234 A 150 150 0 1 0 627 426"/>
      <path stroke-width="70" d="M512 506 L 238 686 Q 204 710 238 732 L 786 732 Q 820 710 786 686 Z"/>
    </g>
    <!-- specular highlights along the top of the metal -->
    <g stroke="url(#spec)" stroke-width="14" stroke-opacity="0.85" filter="url(#soft)">
      <path d="M592 204 A 128 128 0 0 0 400 250"/>
      <path d="M492 532 L 272 678"/>
      <path d="M300 718 L 724 718"/>
    </g>
  </g>
  </g>
</svg>
