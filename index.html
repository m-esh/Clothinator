<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clad</title>
  <meta name="description" content="What to wear today, picked for you.">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clad">
  <style>
    /* Paint the right background from the very first frame (no white flash
       before the stylesheet arrives). */
    html, body { background: #0a0a0b; margin: 0; }
    html:not([data-palette]), html:not([data-palette]) body { background: #0b1122; }
    html[data-palette="espresso"], html[data-palette="espresso"] body { background: #170f09; }
    html[data-palette="forest"], html[data-palette="forest"] body { background: #07150f; }
    html[data-palette="plum"], html[data-palette="plum"] body { background: #120a1c; }
    html[data-palette="oxblood"], html[data-palette="oxblood"] body { background: #18090e; }
  </style>
  <script>
    // Apply the saved colour scheme before anything paints.
    try {
      var p = localStorage.getItem('palette') || 'graphite';
      if (p !== 'denim') document.documentElement.dataset.palette = p;
    } catch (e) { document.documentElement.dataset.palette = 'graphite'; }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preload" href="assets/fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/app.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <!-- Launch intro: the C draws, the hanger hangs and swings, the name rises.
       Inline so it shows at first paint and covers loading; tap to skip. -->
  <div id="intro" aria-hidden="true">
    <div class="intro-stage">
      <svg class="intro-mark" viewBox="170 120 684 650">
        <defs>
          <linearGradient id="intro-metal" x1="0" y1="150" x2="0" y2="760" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.32" stop-color="#dcdfe4"/>
            <stop offset="0.55" stop-color="#8f949d"/>
            <stop offset="0.7" stop-color="#cdd0d6"/>
            <stop offset="0.9" stop-color="#eef0f3"/>
            <stop offset="1" stop-color="#a5aab3"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#intro-metal)" stroke-linecap="round" stroke-linejoin="round">
          <path class="intro-c" pathLength="1" stroke-width="108" d="M627 234 A 150 150 0 1 0 627 426"/>
          <g class="intro-hanger">
            <path class="intro-stem" pathLength="1" stroke-width="70" d="M512 470 L 512 506"/>
            <path class="intro-body" pathLength="1" stroke-width="70" d="M512 506 L 238 686 Q 204 710 238 732 L 786 732 Q 820 710 786 686 Z"/>
          </g>
        </g>
      </svg>
      <div class="intro-word">Clad</div>
    </div>
  </div>
  <script>
    (function () {
      // window.__introDone resolves when the intro has gone. The app holds
      // its heavy work (and update reloads) until then, so the animation
      // never stalls and jumps ahead.
      var resolve;
      window.__introDone = new Promise(function (r) { resolve = r; });
      var el = document.getElementById('intro');
      var skip = false;
      try { skip = sessionStorage.getItem('skipIntro') === '1'; sessionStorage.removeItem('skipIntro'); } catch (e) {}
      if (skip) { el.remove(); resolve(); return; }
      var gone = false;
      function remove() { if (!gone) { gone = true; el.remove(); resolve(); } }
      el.addEventListener('animationend', function (e) { if (e.target === el) remove(); });
      // Skip only on a deliberate tap, not a stray touch while launching.
      var shownAt = Date.now();
      el.addEventListener('click', function () {
        if (Date.now() - shownAt < 500) return;
        el.classList.add('skip');
        setTimeout(remove, 260);
      });
      setTimeout(remove, 3400); // never stay up, whatever happens to animations
    })();
  </script>
  <main id="view"></main>
  <nav id="tabs" class="tabs glass" aria-label="Sections"></nav>
</body>
</html>
